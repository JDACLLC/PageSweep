<!doctype html>
<html lang="en"><meta charset="utf-8"><title>PageSweep Nested Scroll Fixture</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; font:15px/1.5 system-ui }
  header { height:64px; padding:12px 22px; box-sizing:border-box; background:#203452; color:white }
  main { display:flex; height:calc(100vh - 64px); min-height:0 }
  nav { width:230px; background:#e9edf4; padding:20px; box-sizing:border-box; }
  #thread { flex:1; min-width:0; overflow-y:auto; display:flex; flex-direction:column-reverse; overscroll-behavior:contain; }
  #messages { display:flex; flex-direction:column; padding:20px; gap:16px; }
  article { background:#f0f2f4; border:1px solid #d1d5db; padding:14px; max-width:800px; }
  pre { max-height:180px; overflow-y:auto; background:#15243c; color:#eff7ff; padding:12px }
  footer { height:32px; background:#f9fafb }
</style>
<header>Nested and reverse scrolling regression fixture</header>
<main>
<nav>Fixed navigation region that should not become the primary scroll surface.</nav>
<div id="thread"><div id="messages"></div></div>
</main>
<script>
const root = document.querySelector('#messages');
for(let i=1;i<=70;i++){
 const article=document.createElement('article');
 const heading=document.createElement('strong');
 heading.textContent='MESSAGE-'+String(i).padStart(3,'0');
 article.append(heading,document.createElement('p'));
 article.lastChild.textContent='Deterministic message body '+i+'. '.repeat(13);
 if(i===35){
   const pre=document.createElement('pre');
   pre.textContent=Array.from({length:70},(_,j)=>'CODE-LINE-'+String(j+1).padStart(3,'0')+' const value = '+j+';').join('\n');
   article.append(pre);
 }
 root.append(article);
}
</script></html>
